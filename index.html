<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Studio | Enterprise Color Design System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>

  <div class="app-container">
    <header class="app-topbar">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-palette"></i></div>
        <span>Aether Studio <small>v3.0</small></span>
      </div>
      <div class="topbar-actions">
        <button id="export-btn" class="secondary-btn" type="button" aria-label="Export Palette">
          <i class="fas fa-code"></i> <span>Export Config</span>
        </button>
      </div>
    </header>

    <main class="studio-card">
      <div class="studio-intro">
        <div class="pill-badge"><span class="pulse-dot"></span> Algorithmic Harmony Engine</div>
        <h1>Engineered Color Palettes</h1>
        <p>Generate professionally balanced color tokens with automatic WCAG contrast compliance.</p>
      </div>

      <div class="action-toolbar">
        <button id="generate-btn" class="primary-btn" type="button">
          <i class="fas fa-wand-magic-sparkles"></i>
          <span>Generate Scheme</span>
          <kbd>Space</kbd>
        </button>
        <div class="toolbar-info">
          <i class="fas fa-circle-info"></i> Click any color card to instantly copy token
        </div>
      </div>

      <section class="palette-matrix" aria-label="Generated Color Swatches">
        <!-- Rendered dynamically by JS -->
      </section>
    </main>
  </div>

  <!-- Export Modal Overlay -->
  <div id="export-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3>Export Palette Tokens</h3>
        <button id="close-modal" class="close-btn" type="button"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="tab-buttons">
          <button class="tab-btn active" data-target="css">CSS Variables</button>
          <button class="tab-btn" data-target="tailwind">Tailwind CSS</button>
          <button class="tab-btn" data-target="json">JSON</button>
        </div>
        <pre><code id="export-code">/* Click generate to load tokens */</code></pre>
      </div>
      <div class="modal-footer">
        <button id="modal-copy-btn" class="primary-btn" type="button"><i class="far fa-copy"></i> Copy Code</button>
      </div>
    </div>
  </div>

  <!-- Global Toast Notification -->
  <div id="toast" class="global-toast" role="status" aria-live="polite">
    <i class="fas fa-circle-check"></i>
    <span id="toast-msg">Copied token to clipboard</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
